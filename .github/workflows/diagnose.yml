name: Diagnose Deployment

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Run diagnostics
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set +e
          REPORT_FILE=$(mktemp)

          # Project info
          echo "## Vercel Project Config" >> "$REPORT_FILE"
          echo '```json' >> "$REPORT_FILE"
          cat .vercel/project.json >> "$REPORT_FILE"
          echo '' >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"

          # Get project ID
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('.vercel/project.json'))['projectId'])")
          echo "**Project ID:** \`$PROJECT_ID\`" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"

          # List project domains
          echo "## Current Project Domains" >> "$REPORT_FILE"
          echo '```json' >> "$REPORT_FILE"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID/domains" >> "$REPORT_FILE"
          echo '' >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"

          # Try adding domain
          echo "## Add Domain Result" >> "$REPORT_FILE"
          echo '```json' >> "$REPORT_FILE"
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"new.crown.direct"}' \
            "https://api.vercel.com/v9/projects/$PROJECT_ID/domains" >> "$REPORT_FILE"
          echo '' >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"

          # Check domain verification
          echo "## Domain Verification" >> "$REPORT_FILE"
          echo '```json' >> "$REPORT_FILE"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID/domains/new.crown.direct" >> "$REPORT_FILE"
          echo '' >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"

          # List recent deployments
          echo "## Recent Deployments (last 3)" >> "$REPORT_FILE"
          echo '```json' >> "$REPORT_FILE"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&limit=3" >> "$REPORT_FILE"
          echo '' >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"

          # DNS lookup
          echo "## DNS Lookup" >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"
          nslookup new.crown.direct >> "$REPORT_FILE" 2>&1 || true
          echo '```' >> "$REPORT_FILE"

          # Curl tests
          echo "## Curl: new.crown.direct" >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"
          curl -svI https://new.crown.direct >> "$REPORT_FILE" 2>&1 || true
          echo '```' >> "$REPORT_FILE"

          # Post to issue
          gh issue comment 9 --repo crownscc/crown-academy-tracker --body-file "$REPORT_FILE"
