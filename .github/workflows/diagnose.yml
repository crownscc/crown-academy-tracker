name: Diagnose Deployment

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Run diagnostics
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPORT_FILE=$(mktemp)

          # Project info
          echo "## Vercel Project Config" >> "$REPORT_FILE"
          echo '```json' >> "$REPORT_FILE"
          cat .vercel/project.json >> "$REPORT_FILE"
          echo '' >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"

          # Get project ID
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('.vercel/project.json'))['projectId'])")
          echo "**Project ID:** \`$PROJECT_ID\`" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"

          # List project domains
          echo "## Current Project Domains" >> "$REPORT_FILE"
          echo '```json' >> "$REPORT_FILE"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID/domains" >> "$REPORT_FILE"
          echo '' >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"

          # Try adding domain
          echo "## Add Domain Result" >> "$REPORT_FILE"
          echo '```json' >> "$REPORT_FILE"
          curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"new.crown.direct"}' \
            "https://api.vercel.com/v9/projects/$PROJECT_ID/domains" >> "$REPORT_FILE"
          echo '' >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"

          # Check domain verification
          echo "## Domain Verification" >> "$REPORT_FILE"
          echo '```json' >> "$REPORT_FILE"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID/domains/new.crown.direct" >> "$REPORT_FILE"
          echo '' >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"

          # List recent deployments
          echo "## Recent Deployments (last 3)" >> "$REPORT_FILE"
          echo '```json' >> "$REPORT_FILE"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&limit=3" >> "$REPORT_FILE"
          echo '' >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"

          # DNS lookup
          echo "## DNS Lookup" >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"
          nslookup new.crown.direct >> "$REPORT_FILE" 2>&1 || true
          echo '```' >> "$REPORT_FILE"

          # Curl tests - homepage
          echo "## Test 1: Homepage (new.crown.direct)" >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"
          curl -sI https://new.crown.direct >> "$REPORT_FILE" 2>&1 || true
          echo '```' >> "$REPORT_FILE"

          # Curl tests - API students
          echo "## Test 2: API /api/students" >> "$REPORT_FILE"
          echo '```json' >> "$REPORT_FILE"
          curl -s https://new.crown.direct/api/students >> "$REPORT_FILE" 2>&1 || true
          echo '' >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"

          # Curl tests - API stats
          echo "## Test 3: API /api/stats" >> "$REPORT_FILE"
          echo '```json' >> "$REPORT_FILE"
          curl -s https://new.crown.direct/api/stats >> "$REPORT_FILE" 2>&1 || true
          echo '' >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"

          # Curl tests - API courses
          echo "## Test 4: API /api/courses" >> "$REPORT_FILE"
          echo '```json' >> "$REPORT_FILE"
          curl -s https://new.crown.direct/api/courses >> "$REPORT_FILE" 2>&1 || true
          echo '' >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"

          # Curl tests - vercel.app domain
          echo "## Test 5: crown-academy-tracker.vercel.app" >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"
          curl -sI https://crown-academy-tracker.vercel.app >> "$REPORT_FILE" 2>&1 || true
          echo '```' >> "$REPORT_FILE"

          # Post to issue via GitHub API
          BODY=$(python3 -c "import json,sys; print(json.dumps(open(sys.argv[1]).read()))" "$REPORT_FILE")
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"body\": $BODY}" \
            "https://api.github.com/repos/crownscc/crown-academy-tracker/issues/9/comments"
