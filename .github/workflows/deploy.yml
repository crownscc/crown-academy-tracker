name: Deploy to Vercel

on:
  push:
    branches: [claude/analyze-test-coverage-kffP9]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Show Vercel project info
        run: |
          echo "## Vercel Project Info" >> $GITHUB_STEP_SUMMARY
          cat .vercel/project.json >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        id: deploy
        run: |
          DEPLOY_OUTPUT=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | tail -1)
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "## Deploy Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$DEPLOY_OUTPUT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Deploy URL: $DEPLOY_URL"

      - name: Add domain via Vercel API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "## Domain Configuration" >> $GITHUB_STEP_SUMMARY

          # Get project ID from .vercel/project.json
          PROJECT_ID=$(cat .vercel/project.json | python3 -c "import sys,json; print(json.load(sys.stdin)['projectId'])")
          echo "Project ID: $PROJECT_ID" >> $GITHUB_STEP_SUMMARY

          # Check existing domains
          echo "### Existing domains" >> $GITHUB_STEP_SUMMARY
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID/domains" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Add new.crown.direct domain
          echo "### Adding new.crown.direct" >> $GITHUB_STEP_SUMMARY
          ADD_RESULT=$(curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"new.crown.direct"}' \
            "https://api.vercel.com/v9/projects/$PROJECT_ID/domains")
          echo "$ADD_RESULT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Also try vercel alias
          echo "### Alias attempt" >> $GITHUB_STEP_SUMMARY
          ALIAS_RESULT=$(vercel alias set ${{ steps.deploy.outputs.url }} new.crown.direct --token=$VERCEL_TOKEN 2>&1) || true
          echo "$ALIAS_RESULT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check domain config
          echo "### Domain verification status" >> $GITHUB_STEP_SUMMARY
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID/domains/new.crown.direct" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Verify deployment
        run: |
          echo "## Verification" >> $GITHUB_STEP_SUMMARY

          echo "### Deploy URL response" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -sI "${{ steps.deploy.outputs.url }}" 2>&1 | head -10 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### new.crown.direct response" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -sI "https://new.crown.direct" 2>&1 | head -10 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### DNS lookup" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          nslookup new.crown.direct 2>&1 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
