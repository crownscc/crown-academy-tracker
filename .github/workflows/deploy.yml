name: Deploy to Vercel

on:
  push:
    branches: [claude/analyze-test-coverage-kffP9]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $DEPLOY_URL"

      - name: Alias domain to deployment
        run: |
          echo "Setting alias new.crown.direct..."
          vercel alias set ${{ steps.deploy.outputs.url }} new.crown.direct --token=${{ secrets.VERCEL_TOKEN }} || true
          echo "Listing domains..."
          vercel domains ls --token=${{ secrets.VERCEL_TOKEN }} || true

      - name: Verify deployment
        run: |
          echo "Checking deployment URL..."
          curl -sI "${{ steps.deploy.outputs.url }}" | head -5
          echo ""
          echo "Checking new.crown.direct..."
          curl -sI "https://new.crown.direct" | head -5 || echo "Domain not yet resolving"
          echo ""
          echo "Checking DNS..."
          nslookup new.crown.direct || echo "DNS lookup failed"
